<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Manrope:wght@400;700&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="demo.css">

<title>Urban Cart</title>

</head>

<body
  style="
    --a:#0f9d74;
    --hg:linear-gradient(120deg,#062e25,#0f9d74);
    --ig:linear-gradient(135deg,#dff6ee,#b9ebd9);
  "
>

<div class="top">

  <b>🛍️ Urban Cart</b>

  <a href="index.html#work">
    ← Back to portfolio
  </a>

</div>


<div class="hero">

  <h1>
    Everyday tech, delivered fast.
  </h1>

  <p>
    Shop audio, wearables and accessories.
    Add to cart and checkout in seconds.
  </p>

  <a class="btn" href="#shop">
    Shop now
  </a>

</div>


<section id="shop">

  <h2>Products</h2>

  <div
    class="tabs"
    id="tabs"
  ></div>

  <div
    class="cards"
    id="grid"
  ></div>

</section>


<section>

  <h2>Your cart</h2>

  <div
    class="cart"
    id="cart"
  ></div>

</section>


<footer>
  Demo project by Divyansh Sharma
</footer>


<script>

const P = [
  ["Wireless Earbuds", "Audio", 2499, "🎧"],
  ["Bluetooth Speaker", "Audio", 1899, "🔊"],
  ["Smart Watch", "Wearables", 3999, "⌚"],
  ["Fitness Band", "Wearables", 1799, "📿"],
  ["Power Bank", "Accessories", 1299, "🔋"],
  ["Phone Case", "Accessories", 499, "📱"],
  ["USB-C Cable", "Accessories", 299, "🔌"],
  ["Laptop Sleeve", "Accessories", 899, "💼"]
];

const categories = [
  "All",
  "Audio",
  "Wearables",
  "Accessories"
];

let cart = {};

const tabs = document.getElementById("tabs");
const grid = document.getElementById("grid");
const cartElement = document.getElementById("cart");


function show(category) {

  tabs.innerHTML =
    categories
      .map(
        (item) => `
          <button
            class="${item === category ? "on" : ""}"
            onclick="show('${item}')"
          >
            ${item}
          </button>
        `
      )
      .join("");


  grid.innerHTML =
    P
      .map((product, index) => {

        if (
          category !== "All" &&
          product[1] !== category
        ) {
          return "";
        }

        return `
          <div class="item">

            <div class="img">
              ${product[3]}
            </div>

            <div class="b">

              <h3>${product[0]}</h3>

              <p>${product[1]}</p>

              <div class="price">

                ₹${product[2]}

                <button
                  onclick="add(${index}, 1)"
                >
                  Add
                </button>

              </div>

            </div>

          </div>
        `;

      })
      .join("");
}


function add(index, quantity) {

  cart[index] =
    (cart[index] || 0) + quantity;

  if (cart[index] <= 0) {
    delete cart[index];
  }

  draw();
}


function draw() {

  const keys =
    Object.keys(cart);

  if (!keys.length) {

    cartElement.innerHTML =
      "Your cart is empty. Add a product above.";

    return;
  }

  let total = 0;


  const itemsHTML =
    keys
      .map((index) => {

        const product = P[index];

        const quantity =
          cart[index];

        const itemTotal =
          product[2] * quantity;

        total += itemTotal;

        return `
          <div class="row">

            <span>
              ${product[3]}
              ${product[0]}
            </span>

            <span>

              <button
                onclick="add(${index}, -1)"
              >
                −
              </button>

              ${quantity}

              <button
                onclick="add(${index}, 1)"
              >
                +
              </button>

              ₹${itemTotal}

            </span>

          </div>
        `;

      })
      .join("");


  cartElement.innerHTML =
    itemsHTML +

    `
      <div class="row">

        <b>Total</b>

        <b>₹${total}</b>

      </div>

      <br>

      <button
        class="btn"
        id="checkoutBtn"
      >
        Checkout
      </button>
    `;


  document
    .getElementById("checkoutBtn")
    .addEventListener("click", () => {

      cart = {};

      cartElement.innerHTML =
        "Order placed! Thank you for shopping.";

    });

}


show("All");

draw();

</script>

</body>
</html>
